name: ci

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - run: cargo fmt --all -- --check
      - run: cargo test --locked
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo build --release --locked
      - name: install cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked
      - run: cargo deny check

  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - run: rustup toolchain install nightly-2026-09-16 --profile minimal
      - run: cargo +1.98.1 install cargo-fuzz --version 0.13.2 --locked
      - run: cargo +nightly-2026-09-16 metadata --manifest-path fuzz/Cargo.toml --locked --format-version 1 >/dev/null
      - working-directory: fuzz
        run: cargo +nightly-2026-09-16 fuzz run archive-path -- -max_total_time=10 -rss_limit_mb=4096 -max_len=4096
